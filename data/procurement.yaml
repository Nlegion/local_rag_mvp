# data/procurement.yaml
metadata:
  process_name: "Закупка товаров и услуг (Procurement)"
  process_owner: "Отдел закупок"
  version: "1.2"
triggers: ["закупка", "купить", "procurement", "50", "100", "200", "300", "тысяч", "тр", "тысяча", "тысячи"]
categories:
  - category_id: "T1"
    description: "Закупка на сумму до 50 000 руб."
    steps:
      - step_id: "T1-1"
        description: "Создать заявку в Jira в проекте PROC. В заголовке указать 'T1: [Название]'."
        user_instruction: "Создайте заявку в Jira по ссылке: https://jira.company.com/secure/CreateIssue.jspa?pid=12345"
      - step_id: "T1-2"
        description: "Дождаться согласования от руководителя отдела."
        user_instruction: "Дождитесь согласования от вашего руководителя"

  - category_id: "T2"
    description: "Закупка на сумму от 50 001 до 200 000 руб."
    steps:
      - step_id: "T2-1"
        description: "Создать заявку в Jira в проекте PROC. В заголовке указать 'T2: [Название]'."
        user_instruction: "Создайте заявку в Jira по ссылке: https://jira.company.com/secure/CreateIssue.jspa?pid=12345"
      - step_id: "T2-2"
        description: "Получить согласование от финансового контроллера."
        user_instruction: "Получите согласование от финансового контроллера"
      - step_id: "T2-3"
        description: "Получить согласование от руководителя дирекции."
        user_instruction: "Получите согласование от руководителя дирекции"

  - category_id: "T3"
    description: "Закупка на сумму свыше 200 000 руб."
    steps:
      - step_id: "T3-1"
        description: "Создать заявку в Jira в проекте PROC. В заголовке указать 'T3: [Название]'."
        user_instruction: "Создайте заявку в Jira по ссылке: https://jira.company.com/secure/CreateIssue.jspa?pid=12345"
      - step_id: "T3-2"
        description: "Подготовить коммерческое предложение и обоснование закупки."
        user_instruction: "Подготовьте коммерческое предложение и обоснование закупки"
      - step_id: "T3-3"
        description: "Получить согласование от финансового контроллера и руководителя дирекции."
        user_instruction: "Получите согласование от финансового контроллера и руководителя дирекции"
      - step_id: "T3-4"
        description: "Организовать заседание тендерной комиссии."
        user_instruction: "Организуйте заседание тендерной комиссии"
      - step_id: "T3-5"
        description: "Получить итоговое согласование от генерального директора."
        user_instruction: "Получите итоговое согласование от генерального директора"